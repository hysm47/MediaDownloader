name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug
      - name: Inspect yt-dlp AAR
        run: |
          echo "Looking for yt-dlp AAR..."
          find ~/.gradle/caches/modules-2/files-2.1/dev.ffmpegkit-maintained/yt-dlp-android/2.0.2 -type f -print
          AAR=$(find ~/.gradle/caches/modules-2/files-2.1/dev.ffmpegkit-maintained/yt-dlp-android/2.0.2 -name '*.aar' | head -n 1)
          if [ -z "$AAR" ]; then
            echo "AAR not found"
            exit 1
          fi
          echo "AAR=$AAR"
          unzip -p "$AAR" classes.jar > /tmp/ytdlp-classes.jar
          jar tf /tmp/ytdlp-classes.jar | grep -i ytdlp | head -100
          javap -classpath /tmp/ytdlp-classes.jar dev.ffmpegkit_maintained.ytdlp.YtDlp
          javap -classpath /tmp/ytdlp-classes.jar dev.ffmpegkit_maintained.ytdlp.YtDlpRequest
          javap -classpath /tmp/ytdlp-classes.jar dev.ffmpegkit_maintained.ytdlp.DownloadProgressCallback
          javap -classpath /tmp/ytdlp-classes.jar dev.ffmpegkit_maintained.ytdlp.YtDlpResponse
          javap -c -classpath /tmp/ytdlp-classes.jar dev.ffmpegkit_maintained.ytdlp.YtDlp
          echo "===== YtDlpException REFERENCES ====="
          javap -c -p -classpath /tmp/ytdlp-classes.jar dev.ffmpegkit_maintained.ytdlp.YtDlp | grep -B 15 -A 20 "YtDlpException"
          echo "===== YtDlpException ====="
          echo "===== YtDlp FULL BYTECODE ====="
          javap -c -p -classpath /tmp/ytdlp-classes.jar dev.ffmpegkit_maintained.ytdlp.YtDlp > /tmp/ytdlp-bytecode.txt
          cat /tmp/ytdlp-bytecode.txt
          echo "===== YtDlpException IN EXECUTE ====="
          echo "===== ONLY YtDlpException LINES ====="
          grep -n "YtDlpException" /tmp/ytdlp-bytecode.txt || true
          grep -n -B 20 -A 30 "YtDlpException" /tmp/ytdlp-bytecode.txt || true
          javap -c -p -classpath /tmp/ytdlp-classes.jar dev.ffmpegkit_maintained.ytdlp.YtDlpException
      - uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
