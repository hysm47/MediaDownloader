*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:22px 14px 40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.app{max-width:560px;margin:0 auto}
[hidden]{display:none!important}
.view{display:none}
.view.active{display:block}
h1{font-size:24px;margin:0;letter-spacing:-.4px}
.sub{margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.lbl{display:block;font-size:13px;font-weight:700;margin:0 0 8px}

/* Home */
.home-btn{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:start}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;min-height:40px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
#homeView.active{display:flex;flex-direction:column;min-height:calc(100vh - 140px);min-height:calc(100dvh - 140px)}
.home-foot{margin-top:auto;padding-top:28px;display:flex;justify-content:center}
.pill:active{transform:translateY(1px)}
a.c-item{display:flex;align-items:center;gap:10px;margin-top:8px;padding:12px 14px;border-radius:13px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:14px;font-weight:700}
.c-item span:last-child{margin-inline-start:auto;color:var(--muted);font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-btn:active{transform:translateY(1px)}
.home-ico{flex:0 0 46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--soft)}
.home-btn strong{display:block;font-size:16px;margin-bottom:3px}
.home-btn span span{display:block;font-size:13px;color:var(--muted);line-height:1.4}

/* Theme picker */
.head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 10px}
.topbar{flex:0 0 44px;height:44px}
.tools{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.lang-btn{font-size:20px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px;line-height:1;padding:0}
.icon-btn[aria-expanded=true]{border-color:var(--accent);background:var(--soft)}
.menu{position:absolute;top:50px;inset-inline-end:0;z-index:10;width:min(260px,100%);max-width:calc(100vw - 28px);max-height:min(70vh,440px);overflow-y:auto;box-sizing:border-box;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.menu[hidden]{display:none}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themes .theme{min-width:0;overflow:hidden;white-space:nowrap}
.theme{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 10px;border-radius:13px;background:var(--field);border:1px solid var(--line);font-size:13px;font-weight:600}
.theme[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}
.sw{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line)}

/* Arabic */
html[lang=ar],html[lang=ar] body{font-family:"Rassid",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-synthesis:none}
html[lang=ar] h1{letter-spacing:0;font-size:26px}
html[lang=ar] .sub{font-size:15px;line-height:1.7}
html[lang=ar] .hint{font-size:13px;line-height:1.7}
html[lang=ar] .how{font-size:14px;line-height:1.9}
html[lang=ar] .chip small{font-size:12px}
html[lang=ar] .lbl{font-size:14px}
html[lang=ar] .home-btn strong{font-size:18px}
[dir=rtl] #url:placeholder-shown{text-align:right}

/* Back */
.back{width:100%;min-height:46px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:700}

/* Link field */
.row{display:flex;gap:8px}
.field{position:relative;flex:1;min-width:0}
input[type=text]{width:100%;min-height:50px;border-radius:13px;border:1px solid var(--line);background:var(--field);padding:0 46px 0 14px;outline:none}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.clear{display:none;position:absolute;top:50%;right:8px;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--btn);border:1px solid var(--btn-line);font-size:18px;line-height:1;padding:0}
.clear.show{display:block}
.msg{margin-top:10px;font-size:13px;color:var(--bad)}
.msg:empty{display:none}

/* Type tabs and choices */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tabs button{min-height:48px;border-radius:13px;background:var(--field);border:1px solid var(--line);color:var(--muted);font-weight:700}
.tabs button[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--text)}
.grid{display:grid;gap:8px}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.c2{grid-template-columns:1fr 1fr}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:8px 4px;border-radius:13px;background:var(--field);border:1px solid var(--line);color:var(--muted);text-align:center}
.chip b{font-size:14px;color:var(--text)}
.chip small{font-size:11px;line-height:1.25}
.chip.wide{grid-column:1/-1;flex-direction:row;gap:10px;min-height:52px}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--chip-on)}
.chip[aria-pressed=true] small{color:inherit;opacity:.85}
.grid + .grid{margin-top:8px}

/* Buttons and output */
.gen,.copy{width:100%;min-height:52px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:800}
.gen{margin-top:16px}
.copy{margin-top:10px}
.copy.done,.mini.done{background:#2e9e64;border-color:#2e9e64;color:#fff}
.out{display:none}
.out.show{display:block}
.out .hint{white-space:pre-line}
pre{margin:0;padding:13px;background:var(--code);border:1px solid var(--code-line);border-radius:12px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--code-text);direction:ltr;text-align:left}
.hint{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.5}

/* Setup */
.step{margin-top:12px}
.step p{margin:0 0 8px;font-size:14px;font-weight:700}
a.gen{display:flex;align-items:center;justify-content:center;text-decoration:none}
.how{margin:10px 0 0;padding-inline-start:20px;font-size:13px;line-height:1.7;color:var(--muted)}
.how b{color:var(--text)}
.shot{display:block;width:100%;height:auto;margin-top:12px;border-radius:12px;border:1px solid var(--line)}
.mini{width:100%;min-height:42px;margin-top:8px;border-radius:11px;background:var(--btn);border:1px solid var(--btn-line);font-weight:700;font-size:13px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>

<main class="app">

  <header class="head">

    </div>

  <!-- Download -->

          <button class="clear" type="button" id="clearBtn" aria-label="Clear link" data-i18n-aria="aria_clear">×</button>
        </div>

    <section class="card">

<script>
"use strict";

// ---------- Developer contact ----------
// Fill in the ones you use and leave the rest empty (they will not be shown).
//   telegram / instagram : username only, e.g. 'myname'
//   whatsapp             : full number, digits only, with country code, e.g. '201234567890'
//   email                : e.g. 'me@example.com'
const DEVELOPER = { telegram: 'haithamvx', whatsapp: '', instagram: '', email: '' };

// [key, icon, name, note, link builder, text shown]
const CONTACT_DEFS = [
  ['telegram',  '✈️', 'Telegram',  'Fastest reply',  v => `https://t.me/${encodeURIComponent(v)}`,          v => '@' + v],
  ['whatsapp',  '💬', 'WhatsApp',  'Send a message', v => `https://wa.me/${v}`,                             v => '+' + v],
  ['instagram', '📷', 'Instagram', 'Direct message', v => `https://instagram.com/${encodeURIComponent(v)}`, v => '@' + v],
  ['email',     '✉️', 'Email',     'For longer notes', v => `mailto:${v}`,                                  v => v]
];

// ---------- Settings ----------
// [value, label, description]
const VIDEO_TOP  = ['best', 'Best available', 'Highest available quality'];
const VIDEO_OPTS = [
  ['2160', '2160p', '4K'], ['1440', '1440p', '2K'], ['1080', '1080p', 'Full HD'], ['720', '720p', 'HD'],
  ['480', '480p', 'Standard'], ['360', '360p', 'Low'], ['240', '240p', 'Very low'], ['144', '144p', 'Lowest']
];
const AUDIO_OPTS = [
  ['mp3', 'MP3', 'Compatible with most devices'], ['m4a', 'M4A', 'Good quality, smaller size'],
  ['opus', 'Opus', 'Excellent quality, small size'], ['flac', 'FLAC', 'Lossless quality, larger files']
];
const choices = { video: '720', audio: 'mp3' };

// ---------- Language ----------
// Arabic strings. English is read from the page itself.
const AR = {
 "home_sub": "حمّل الفيديوهات والموسيقى مباشرة من داخل التطبيق.",
 "dl_t": "التحميل",
 "dl_d": "الصق الرابط واختر إعدادات التحميل.",
 "gen": "بدء التحميل",
 "lbl_status": "حالة التحميل",
 "status_ready": "سيتم ربط محرك التحميل الداخلي في الخطوة التالية.",
 "contact_btn": "التواصل مع المطوّر",
 "title_home": "محمّل الوسائط",
 "title_download": "التحميل",
 "title_contact": "تواصل",
 "contact_sub": "أسئلة أو مشاكل أو أفكار؟ راسلني على تيليجرام.",
 "back": "→ رجوع",
 "copy": "نسخ",
 "copied": "تم النسخ",
 "copyfail": "فشل النسخ. اضغط مطولاً على النص لنسخه.",
 "lbl_link": "1. الرابط",
 "ph_url": "الصق الرابط هنا",
 "aria_clear": "مسح الرابط",
 "lbl_what": "2. نوع التحميل",
 "tab_video": "فيديو",
 "tab_audio": "موسيقى",
 "opt_quality": "الجودة",
 "opt_format": "الصيغة",
 "l_best": "أفضل جودة متاحة",
 "d_best": "أعلى جودة متوفرة",
 "d_1080": "Full HD",
 "d_480": "جودة عادية",
 "d_360": "منخفضة",
 "d_240": "منخفضة جدًا",
 "d_144": "الأدنى",
 "d_mp3": "متوافق مع معظم الأجهزة",
 "d_m4a": "جودة جيدة، حجم أصغر",
 "d_opus": "جودة ممتازة، حجم صغير",
 "d_flac": "بدون فقد للجودة، حجم كبير",
 "err_empty": "الصق رابطاً أولاً.",
 "err_bad": "يبدو أن الرابط غير صالح. تأكد من أنه يبدأ بـ https://",
 "theme_lbl": "المظهر",
 "aria_theme": "تغيير المظهر",
 "aria_lang": "تغيير اللغة",
 "th_ocean": "محيط",
 "th_black": "أسود",
 "th_light": "فاتح",
 "th_forest": "غابة",
 "th_violet": "بنفسجي",
 "th_rose": "وردي",
 "th_gold": "ذهبي",
 "th_royal": "ملكي",
 "th_champagne": "شامبانيا",
 "th_bronze": "برونزي",
 "th_emerald": "زمردي",
 "th_burgundy": "عنابي",
 "l_2160": "2160p",
 "d_2160": "4K",
 "l_1440": "1440p",
 "d_1440": "2K",
 "l_1080": "1080p",
 "l_720": "720p",
 "d_720": "HD",
 "l_480": "480p",
 "l_360": "360p",
 "l_240": "240p",
 "l_144": "144p"
};
let lang = 'en', curView = 'home';
const T = (k, en) => (lang === 'ar' && AR[k] != null ? AR[k] : en);

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
let mode = 'video';

// Finds the first HTTPS/HTTP URL in pasted text and validates it.
function extractUrl(raw) {
  const m = String(raw || '').match(/https?:\/\/[^\s"'<>]+/i);
  if (!m) return null;
  const candidate = m[0].replace(/[).,;!?]+$/, '');
  try {
    const u = new URL(candidate);
    return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null;
  } catch (_) {
    return null;
  }
}

// ---------- Download ----------
function reset() {
  $('msg').textContent = '';
  $('out').classList.remove('show');
  $('clearBtn').classList.toggle('show', $('url').value.length > 0);
  $('statusText').textContent = T('status_ready', 'The internal download engine will be connected in the next step.');
}

function getDownloadOptions() {
  return {
    url: extractUrl($('url').value.trim()),
    mode,
    choice: choices[mode]
  };
}

function generate() {
  reset();
  const options = getDownloadOptions();
  if (!options.url) {
    const raw = $('url').value.trim();
    $('msg').textContent = raw
      ? T('err_bad', "That doesn't look like a valid link. Make sure it starts with https://")
      : T('err_empty', 'Paste a link first.');
    if (!raw) $('url').focus();
    return;
  }

  const selected = mode === 'video'
    ? T('l_' + options.choice, options.choice === 'best' ? 'Best available' : options.choice + 'p')
    : T('l_' + options.choice, options.choice.toUpperCase());

  // Stage 3: send the selected request to Android. No download engine is
  // involved yet; Android only acknowledges that the bridge received it.
  if (!window.MediaDownloader || typeof window.MediaDownloader.requestDownload !== 'function') {
    $('statusText').textContent = T('bridge_missing', 'Android bridge is not available.');
    $('out').classList.add('show');
    return;
  }

  try {
    const raw = window.MediaDownloader.requestDownload(options.url, options.mode, options.choice);
    const reply = JSON.parse(raw);
    if (!reply.ok) {
      const detail = [
        reply.error || '',
        reply.message || '',
        reply.stackTrace || '',
        reply.output || '',
        reply.errorOutput || ''
      ].filter(Boolean).join('\n');
      throw new Error(detail || 'Unknown yt-dlp error');
    }
    $('statusText').textContent = `${T('bridge_ok', 'Android bridge connected.')}\n${selected}`;
  } catch (e) {
    $('statusText').textContent = `yt-dlp debug:\n${e.message || e}`;
  }
  $('out').classList.add('show');
  $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function makeChip([value, label, desc], wide) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip' + (wide ? ' wide' : '');
  b.dataset.value = value;
  const name = document.createElement('b'); name.textContent = T('l_' + value, label);
  const small = document.createElement('small'); small.textContent = T('d_' + value, desc);
  b.append(name, small);
  b.onclick = () => { choices[mode] = value; markChoice(); reset(); };
  return b;
}

function markChoice() {
  document.querySelectorAll('#choices .chip').forEach(c =>
    c.setAttribute('aria-pressed', c.dataset.value === choices[mode]));
}

function renderChoices() {
  const box = $('choices');
  box.innerHTML = '';
  if (mode === 'video') {
    const top = document.createElement('div'); top.className = 'grid';
    top.appendChild(makeChip(VIDEO_TOP, true));
    const grid = document.createElement('div'); grid.className = 'grid c4';
    VIDEO_OPTS.forEach(o => grid.appendChild(makeChip(o)));
    box.append(top, grid);
  } else {
    const grid = document.createElement('div'); grid.className = 'grid c2';
    AUDIO_OPTS.forEach(o => grid.appendChild(makeChip(o)));
    box.appendChild(grid);
  }
  markChoice();
}

function setMode(m) {
  mode = m;
  $('tabVideo').setAttribute('aria-pressed', m === 'video');
  $('tabAudio').setAttribute('aria-pressed', m === 'audio');
  $('optLabel').textContent = m === 'video' ? T('opt_quality', 'Quality') : T('opt_format', 'Format');
  renderChoices();
  reset();
}

// ---------- Themes ----------
// [id, name, background, accent]
const THEMES = [
  ['ocean', 'Ocean', '#0a101c', '#5b8cff'], ['black', 'Black', '#000000', '#f4f4f5'],
  ['light', 'Light', '#f2f5fa', '#2f6bff'], ['forest', 'Forest', '#08120e', '#34d399'],
  ['violet', 'Violet', '#0f0a1c', '#8a63f5'], ['rose', 'Rose', '#14090c', '#f0506a'],
  ['gold', 'Gold', '#0b0906', '#d4af37'], ['royal', 'Royal', '#080e20', '#e2b44a'],
  ['champagne', 'Champagne', '#f7f1e1', '#a87700'], ['bronze', 'Bronze', '#140d06', '#f0a020'],
  ['emerald', 'Emerald', '#06140f', '#d9b44a'], ['burgundy', 'Burgundy', '#170608', '#d8b25a']
];

function applyTheme(id, save) {
  const t = THEMES.find(x => x[0] === id) || THEMES[0];
  document.documentElement.dataset.theme = t[0];
  document.querySelector('meta[name="theme-color"]').content = t[2];
  document.querySelectorAll('#themes .theme').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === t[0]));
  if (save) { try { localStorage.setItem('md-theme', t[0]); } catch (_) {} }
}

function setMenu(open) {
  $('themeMenu').hidden = !open;
  $('themeBtn').setAttribute('aria-expanded', open);
}
$('themeBtn').onclick = e => { e.stopPropagation(); setMenu($('themeMenu').hidden); };
document.addEventListener('click', e => { if (!$('themeMenu').contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

THEMES.forEach(([id, name, bg, accent]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'theme'; b.dataset.id = id;
  const sw = document.createElement('span'); sw.className = 'sw';
  sw.style.background = `linear-gradient(135deg, ${bg} 50%, ${accent} 50%)`;
  const nm = document.createElement('span'); nm.textContent = name; nm.dataset.i18n = 'th_' + id;
  b.append(sw, nm);
  b.onclick = () => { applyTheme(id, true); setMenu(false); };
  $('themes').appendChild(b);
});
let savedTheme = 'ocean';
try { savedTheme = localStorage.getItem('md-theme') || 'ocean'; } catch (_) {}
applyTheme(savedTheme, false);

// ---------- Screens ----------
// Uses browser history so the phone's Back gesture moves between screens.
let historyOk = typeof history.pushState === 'function';

const TITLES = { home: 'Media Downloader', download: 'Download', contact: 'Contact' };

function showView(name, push = true) {
  curView = name;
  $('title').textContent = T('title_' + name, TITLES[name] || TITLES.home);
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $(name + 'View').classList.add('active');
  if (push && historyOk && history.state?.view !== name) {
    try { history.pushState({ view: name, depth: (history.state?.depth || 0) + 1 }, '', '#' + name); }
    catch (_) { historyOk = false; }
  }
  window.scrollTo(0, 0);
}

try { history.replaceState({ view: 'home', depth: 0 }, '', location.pathname + location.search); }
catch (_) { historyOk = false; }

window.addEventListener('popstate', e => showView(e.state?.view || 'home', false));

document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
  if (historyOk && (history.state?.depth || 0) > 0) history.back();
  else showView('home', false);
});
$('goDownload').onclick = () => showView('download');

// ---------- Contact screen ----------
function cleanContact(key, raw) {
  const v = String(raw || '').trim();
  if (key === 'whatsapp') return v.replace(/\D/g, '');
  if (key === 'email') return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? v : '';
  return v.replace(/^@/, '').replace(/[^\w.]/g, '');
}

let contactCount = 0;
CONTACT_DEFS.forEach(([key, icon, name, note, link, shown]) => {
  const v = cleanContact(key, DEVELOPER[key]);
  if (!v) return;
  contactCount++;
  const a = document.createElement('a');
  a.className = 'c-item';
  a.href = link(v);
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  const ico = document.createElement('span'); ico.textContent = icon; ico.setAttribute('aria-hidden', 'true');
  const t = document.createElement('span'); t.textContent = name;
  const d = document.createElement('span'); d.textContent = shown(v); d.dir = 'ltr';
  a.append(ico, t, d);
  $('contactList').appendChild(a);
});
$('goContact').hidden = contactCount === 0;
$('goContact').onclick = () => showView('contact');

// ---------- Events ----------
$('tabVideo').onclick = () => setMode('video');
$('tabAudio').onclick = () => setMode('audio');
$('url').addEventListener('input', reset);
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
$('clearBtn').onclick = () => { $('url').value = ''; reset(); $('url').focus(); };
$('genBtn').onclick = generate;

// ---------- Apply language ----------
function applyLang(l, save) {
  lang = l === 'ar' ? 'ar' : 'en';
  const root = document.documentElement;
  root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
  if (save) { try { localStorage.setItem('md-lang', lang); } catch (_) {} }
  document.querySelectorAll('[data-i18n]').forEach(el => {
    if (el.dataset.en === undefined) el.dataset.en = el.innerHTML;
    el.innerHTML = lang === 'ar' && AR[el.dataset.i18n] != null ? AR[el.dataset.i18n] : el.dataset.en;
  });
  [['data-i18n-ph', 'placeholder', 'enPh'], ['data-i18n-aria', 'aria-label', 'enAria']].forEach(([attr, prop, keep]) =>
    document.querySelectorAll('[' + attr + ']').forEach(el => {
      if (el.dataset[keep] === undefined) el.dataset[keep] = el.getAttribute(prop) || '';
      const k = el.getAttribute(attr);
      el.setAttribute(prop, lang === 'ar' && AR[k] != null ? AR[k] : el.dataset[keep]);
    }));
  $('title').textContent = T('title_' + curView, TITLES[curView] || TITLES.home);
  document.title = T('title_home', 'Media Downloader');
  $('optLabel').textContent = mode === 'video' ? T('opt_quality', 'Quality') : T('opt_format', 'Format');
  $('msg').textContent = '';
  renderChoices();
}
$('langBtn').onclick = () => applyLang(lang === 'ar' ? 'en' : 'ar', true);
let savedLang = null;
try { savedLang = localStorage.getItem('md-lang'); } catch (_) {}
if (!savedLang) savedLang = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';

setMode('video');
applyLang(savedLang, false);
</script>
